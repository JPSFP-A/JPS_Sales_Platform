name: Health Check

on:
  push:
    branches:
      - master
  schedule:
    # 0 12 * * 1-5 = 12:00 UTC weekdays = 08:00 Jamaica (UTC-5)
    - cron: '0 12 * * 1-5'

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check live URL returns HTTP 200
        run: |
          # Tiny static file served by the same deployment, so a 200 means the site is up. Retried because
          # a single 403/5xx from a GitHub runner has been transient.
          for attempt in 1 2 3; do
            status=$(curl -s -I -o /dev/null -w "%{http_code}" https://sales.jmfinancelab.com/health.txt)
            echo "Attempt $attempt: HTTP status $status"
            if [ "$status" = "200" ]; then echo "Health check passed."; exit 0; fi
            [ "$attempt" -lt 3 ] && sleep 30
          done
          echo "Health check FAILED: expected 200, last status $status"
          exit 1
