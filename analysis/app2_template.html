<script>

let D={months:[],mlabels:[],classes:['RT10','RT20','RT40','RT50','RT60','RT70','Other'],cls:{},total:{},accts:[],parishes:[],parish:{},movers:null,budget:null};
const COL={RT10:'#D98900',RT20:'#2563EB',RT40:'#0D9488',RT50:'#7C3AED',RT60:'#EA6C1E',RT70:'#475569',Other:'#94A3B8',Total:'#1E293B'};
const PCOL=['#D98900','#2563EB','#0D9488','#7C3AED','#EA6C1E','#475569','#DC2626','#16A34A','#c8772f','#94A3B8','#475569','#2563EB','#7C3AED','#0D9488','#EA6C1E','#D98900','#16A34A','#c8772f'];
Chart.defaults.color='#475569';Chart.defaults.font.family='Calibri,Segoe UI,sans-serif';Chart.defaults.font.size=12.5;
if(window.ChartDataLabels){Chart.register(ChartDataLabels);Chart.defaults.set('plugins.datalabels',{display:false});}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sp=v=>(v>=0?'+':'')+v.toFixed(1);
// ── Supabase account drill-down ──────────────────────────────────
const _SB=supabase.createClient('https://bhrswnbenkvflpdjhfpa.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJocnN3bmJlbmt2ZmxwZGpoZnBhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzMTc0OTcsImV4cCI6MjA5MTg5MzQ5N30.JupFs0tnMn3k282PqFOSMi2ch-wtB7Ewv7O8fN16-94',
  window.JpsAuth?JpsAuth.clientOptions():undefined);

/* ── Login gate — platform SSO (shared jps_sso_v1 cookie) or manual sign-in.
   This page embeds 1,100+ customers' billing detail in the HTML itself, so it
   must never render for an anonymous visitor. Gates on ANY valid platform
   session (no per-app access row exists for the Explorer yet — if one is added
   to admin.app_access later, tighten the check accordingly).
   KNOWN LIMIT: the gate blocks the rendered UI, but the embedded data blob is
   still present in view-source for anyone who fetches the HTML. Full fix =
   move the embedded blob out of the page into an authenticated fetch (private
   Supabase Storage object) — a build-pipeline change, tracked separately.
   (Do not write the literal placeholder token in comments here — the build
   replaces every occurrence of it with the 800KB data blob.)
   localhost/127.0.0.1 bypasses the gate so local dev previews keep working. */
const _GATE_DEV_BYPASS=['localhost','127.0.0.1'].includes(location.hostname);
function _gateShow(){
  if(document.getElementById('loginGate'))return;
  const g=document.createElement('div');
  g.id='loginGate';
  g.innerHTML='<div style="position:fixed;inset:0;background:#0C3547;z-index:999;display:flex;align-items:center;justify-content:center">'+
    '<div style="background:#fff;border-radius:14px;padding:34px 38px;width:340px;box-shadow:0 20px 60px rgba(0,0,0,.4)">'+
    '<div style="font-family:Georgia,serif;font-size:20px;font-weight:700;color:#0C3547;margin-bottom:4px">JPS Sales Explorer</div>'+
    '<div style="font-size:12px;color:#64748B;margin-bottom:18px">Sign in with your JPS platform account</div>'+
    '<input id="lgEmail" type="email" placeholder="you@jpsco.com" autocomplete="username" style="width:100%;box-sizing:border-box;padding:9px 12px;margin-bottom:8px;border:1px solid #CBD5E1;border-radius:8px;font-size:13px">'+
    '<input id="lgPwd" type="password" placeholder="Password" autocomplete="current-password" style="width:100%;box-sizing:border-box;padding:9px 12px;margin-bottom:8px;border:1px solid #CBD5E1;border-radius:8px;font-size:13px">'+
    '<div id="lgErr" style="display:none;color:#B3261E;font-size:12px;margin-bottom:8px"></div>'+
    '<button id="lgBtn" style="width:100%;padding:10px;border:0;border-radius:8px;background:#0C3547;color:#fff;font-weight:600;font-size:13px;cursor:pointer">Sign In &rarr;</button>'+
    '<div style="font-size:11px;color:#94A3B8;margin-top:12px">Same login as sales.jmfinancelab.com &middot; one sign-in covers all platform apps.</div>'+
    '</div></div>';
  document.body.appendChild(g);
  document.getElementById('lgBtn').addEventListener('click',_gateLogin);
  document.getElementById('lgPwd').addEventListener('keydown',e=>{if(e.key==='Enter')_gateLogin();});
}
async function _gateLogin(){
  const errEl=document.getElementById('lgErr'),btn=document.getElementById('lgBtn');
  errEl.style.display='none';
  const email=document.getElementById('lgEmail').value.trim(),pwd=document.getElementById('lgPwd').value;
  if(!email||!pwd){errEl.textContent='Email and password required.';errEl.style.display='block';return;}
  btn.disabled=true;btn.textContent='Signing in…';
  try{
    const{error}=await _SB.auth.signInWithPassword({email,password:pwd});
    if(error)throw error;
    const gate=document.getElementById('loginGate');if(gate)gate.remove();
  }catch(e){
    errEl.textContent=e.message||'Sign-in failed.';errEl.style.display='block';
  }finally{btn.disabled=false;btn.textContent='Sign In →';}
}
async function _gateInit(){
  if(_GATE_DEV_BYPASS)return;
  _gateShow(); // gate up immediately; removed only on a confirmed session
  try{
    const{data:{session}}=await _SB.auth.getSession();
    if(session){const gate=document.getElementById('loginGate');if(gate)gate.remove();}
  }catch(e){/* gate stays up */}
}
if(document.body)_gateInit();else document.addEventListener('DOMContentLoaded',_gateInit);
const _acctCache={};
// Peak-demand kVA (physical volume, RT40/50/70 only) — live from jps_demand_actuals.
// Not part of the static embedded D blob (which only carries $ revenue components),
// so this is fetched live via the same Supabase client used for account drill-down.
let _demandKva=null;
const DEM_TYPE_ORDER=['standard','on_peak','partial_peak','off_peak'];
const DEM_TYPE_LABEL={standard:'Standard',on_peak:'On-Peak',partial_peak:'Partial-Peak',off_peak:'Off-Peak'};
const DEM_TYPE_COLOR={standard:'#5a7a96',on_peak:'#e25c4b',partial_peak:'#f0ad4e',off_peak:'#00c2a8'};
async function _fetchDemandKva(){
  if(_demandKva)return _demandKva;
  const{data,error}=await _SB.from('jps_demand_actuals').select('year,month,rate_class,demand_type,demand_kva').limit(2000);
  _demandKva=error?[]:(data||[]);
  return _demandKva;
}
// Billing-correction line items on the 40 Special Accounts, cross-referenced with
// who/dept from the Special Accounts Directory. See analysis/load_special_adjustments.py.
let _specialAdj=null;
async function _fetchSpecialAdj(){
  if(_specialAdj)return _specialAdj;
  const{data,error}=await _SB.from('jps_special_account_adjustments')
    .select('year,month,rate_class,scat_code,adj_value,who,dept,account_name,jps_ac').limit(2000);
  _specialAdj=error?[]:(data||[]);
  return _specialAdj;
}
function _parseYM(m){const r=String(m).match(/^(\d{4})-(\d{1,2})$/);return r?{y:+r[1],mo:+r[2]}:null;}
const _budgetCache={};
async function _fetchBudgetAgg(name,rc,m){
  const k=name+'|'+(rc||'')+'|'+m;
  if(_budgetCache[k])return _budgetCache[k];
  const ym=_parseYM(m);
  if(!ym)return null;
  let q=_SB.from('jps_budget').select('kwh_budget,revenue_budget,demand_budget')
    .eq('year',ym.y).eq('month',ym.mo).ilike('name',name);
  if(rc)q=q.ilike('rate_class',rc+'%');
  const {data,error}=await q.limit(500);
  if(error||!data||!data.length){_budgetCache[k]=null;return null;}
  const agg=data.reduce((s,r)=>({kwh:s.kwh+(+r.kwh_budget||0),rev:s.rev+(+r.revenue_budget||0),dem:s.dem+(+r.demand_budget||0)}),{kwh:0,rev:0,dem:0});
  _budgetCache[k]=agg;
  return agg;
}
async function _fetchAccts(name,mB,mC,rc){
  const k=name+'|'+mB+'|'+mC+'|'+(rc||'');
  if(_acctCache[k])return _acctCache[k];
  const bym=_parseYM(mB),cym=_parseYM(mC);
  if(!bym||!cym)return {rows:[],err:`bad month format: ${mB} / ${mC}`};
  // Scope each lookup to its exact year+month first (avoids a full-table ILIKE scan).
  const oneMonth=(y,mo)=>{
    let q=_SB.from('jps_actuals')
      .select('jps_ac,parish,rate_class,kwh,revenue_jmd,demand_jmd')
      .eq('year',y).eq('month',mo)
      .ilike('name',name);
    if(rc)q=q.ilike('rate_class',rc+'%');
    return q.limit(500);
  };
  const budgetForC=(y,mo)=>{
    let q=_SB.from('jps_budget').select('jps_ac,kwh_budget,revenue_budget,demand_budget')
      .eq('year',y).eq('month',mo).ilike('name',name);
    if(rc)q=q.ilike('rate_class',rc+'%');
    return q.limit(500);
  };
  const [resB,resC,resBud]=await Promise.all([oneMonth(bym.y,bym.mo),oneMonth(cym.y,cym.mo),budgetForC(cym.y,cym.mo)]);
  const error=resB.error||resC.error;
  if(error)return {rows:[],err:error.message||error.details||'query error'};
  const byAc={};
  for(const r of (resB.data||[])){
    if(!byAc[r.jps_ac])byAc[r.jps_ac]={ac:r.jps_ac,parish:r.parish,rc:r.rate_class,base:null,cur:null,budget:null};
    byAc[r.jps_ac].base={kwh:+r.kwh,rev:+r.revenue_jmd,dem:r.demand_jmd!=null?+r.demand_jmd:null};
  }
  for(const r of (resC.data||[])){
    if(!byAc[r.jps_ac])byAc[r.jps_ac]={ac:r.jps_ac,parish:r.parish,rc:r.rate_class,base:null,cur:null,budget:null};
    byAc[r.jps_ac].cur={kwh:+r.kwh,rev:+r.revenue_jmd,dem:r.demand_jmd!=null?+r.demand_jmd:null};
  }
  if(!resBud.error) for(const r of (resBud.data||[])){
    if(byAc[r.jps_ac]) byAc[r.jps_ac].budget={kwh:+r.kwh_budget||0,rev:+r.revenue_budget||0,dem:+r.demand_budget||0};
  }
  const res=Object.values(byAc).sort((a,b)=>((b.cur?.kwh||0)+(b.base?.kwh||0))-((a.cur?.kwh||0)+(a.base?.kwh||0)));
  const out={rows:res,err:res.length===0?`no rows matched for "${name}" in ${mB}/${mC}`:null};
  _acctCache[k]=out;
  return out;
}
function _renderAcctTable(rows,lB,lC,err){
  if(err)return '<div style="color:#e25c4b;font-size:11px;padding:6px 0">⚠ '+esc(err)+'</div>';
  if(!rows||!rows.length)return '<div style="color:var(--mut);font-size:12px;padding:6px 0">No account data found.</div>';
  const pc=(a,b)=>a?+((b/a-1)*100).toFixed(1):0;
  const fk=v=>v!=null?(v/1000).toFixed(1):'—';
  const fr=v=>v!=null?(v/1e6).toFixed(2):'—';
  const cls=(a,b)=>a==null||b==null?'':b>=a?'up':'dn';
  let h='<div style="font-size:10px;font-weight:700;color:var(--mut);letter-spacing:1px;margin:8px 0 4px;border-top:1px solid var(--line);padding-top:8px">ACCOUNTS ('+rows.length+') — kWh MWh · Rev J$M</div>';
  h+='<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:11px">';
  h+='<thead><tr style="color:var(--mut);text-align:left">'
    +'<th style="padding:2px 4px">A/c No.</th>'
    +'<th style="padding:2px 4px">Parish</th>'
    +'<th style="padding:2px 4px;text-align:right">kWh '+lB+'</th>'
    +'<th style="padding:2px 4px;text-align:right">kWh '+lC+'</th>'
    +'<th style="padding:2px 4px;text-align:right">Δ kWh%</th>'
    +'<th style="padding:2px 4px;text-align:right">Rev '+lB+'</th>'
    +'<th style="padding:2px 4px;text-align:right">Rev '+lC+'</th>'
    +'<th style="padding:2px 4px;text-align:right">Δ Rev%</th>'
    +'</tr></thead><tbody>';
  let tbk=0,tck=0,tbr=0,tcr=0;
  for(const r of rows){
    const bk=r.base?.kwh,ck=r.cur?.kwh,br=r.base?.rev,cr=r.cur?.rev;
    const dk=pc(bk,ck),dr=pc(br,cr);

function buildAcctBreakdown(a,iB,iC){
  const dpk=j=>a.kwh[j]?a.dem[j]/a.kwh[j]:0, G=(kk,j)=>(a[kk]&&a[kk][j]!=null?a[kk][j]:0);
  const sub='color:var(--mut);font-size:10px;font-weight:700;letter-spacing:1px;border-top:1px solid var(--line);margin:6px 0 3px;padding-top:5px';
  return '<div style="font-size:12.5px;line-height:1.7">'+
    row2('kWh (M)',a.kwh[iB]/1e6,a.kwh[iC]/1e6,'',1)+
    '<div style="'+sub+'">REVENUE LINES — J$M</div>'+
    row2('Energy',G('energy',iB)/1e6,G('energy',iC)/1e6,'',1)+
    row2('Demand',a.dem[iB]/1e6,a.dem[iC]/1e6,'',1)+
    row2('Fuel',G('fuel',iB)/1e6,G('fuel',iC)/1e6,'',1)+
    row2('IPP',G('ipp',iB)/1e6,G('ipp',iC)/1e6,'',1)+
    row2('Customer',G('cust',iB)/1e6,G('cust',iC)/1e6,'',1)+
    '<div style="border-top:1px solid var(--line);margin:4px 0 3px;padding-top:4px"></div>'+
    row2('Total revenue',a.rev[iB]/1e6,a.rev[iC]/1e6,'',1)+
    row2('Demand/kWh',dpk(iB),dpk(iC),' J$',2)+
    '</div>';
}
function buildTrend6mo(a,iC){
  const start=Math.max(0,iC-5);
  const idxs=[];
  for(let i=start;i<=iC;i++) idxs.push(i);
  const rows=idxs.map(i=>'<tr style="border-top:1px solid #1e2d40"><td class="l" style="padding:3px 4px;color:var(--mut)">'+D.mlabels[i]+'</td>'+
    '<td style="padding:3px 4px;text-align:right">'+(a.kwh[i]/1e6).toFixed(1)+'</td>'+
    '<td style="padding:3px 4px;text-align:right">'+(a.dem[i]/1e6).toFixed(1)+'</td>'+
    '<td style="padding:3px 4px;text-align:right">'+(a.rev[i]/1e6).toFixed(1)+'</td></tr>').join('');
  return '<div style="font-size:10px;font-weight:700;color:var(--mut);letter-spacing:1px;margin:10px 0 4px;border-top:1px solid var(--line);padding-top:8px">LAST '+idxs.length+' MONTHS</div>'+
    '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:11px">'+
    '<thead><tr style="color:var(--mut);text-align:left"><th style="padding:2px 4px">Month</th><th style="padding:2px 4px;text-align:right">kWh (M)</th><th style="padding:2px 4px;text-align:right">Demand (J$M)</th><th style="padding:2px 4px;text-align:right">Revenue (J$M)</th></tr></thead>'+
    '<tbody>'+rows+'</tbody></table></div>';
}
function row2(l,a,b,u,dec){const p=pctV(a,b);return '<div style="display:flex;justify-content:space-between"><span class="muted">'+l+'</span><span>'+a.toFixed(dec)+'→<b>'+b.toFixed(dec)+'</b>'+u+' <span class="'+(p>=0?'up':'dn')+'">'+sp(p)+'%</span></span></div>';}
function anchor(n){cSearch=n;cClass='ALL';const r=D.accts.filter(a=>a.n.toLowerCase().includes(n.toLowerCase()));if(r.length)cSel=r.sort((x,y)=>y.rev[y.rev.length-1]-x.rev[x.rev.length-1])[0].id;renderCustomers();}

function renderDemand(){
  let h='<div class="ctrl"><span class="lbl">Demand as</span><div class="seg">'+
    [['abs','J$ charge'],['share','% of revenue'],['perkwh','J$ / kWh']].map(o=>'<button data-dm="'+o[0]+'" class="'+(dMode===o[0]?'on':'')+'">'+o[1]+'</button>').join('')+'</div></div>';
  h+='<div class="grid"><div class="card"><div class="chartttl">Demand charge — by rate class ('+(dMode==='abs'?'J$M':dMode==='share'?'% of class revenue':'J$ per kWh')+')</div><div class="chartwrap"><canvas id="c"></canvas></div></div><div class="kpis" id="kp"></div></div>';
  h+='<div class="card" style="margin-top:14px"><div class="chartttl">Peak Demand Volume — billed kVA (RT40/RT50/RT70), standard vs on/partial/off-peak</div><div id="kvaPanel" style="font-size:12px;color:var(--mut);padding:8px 0">Loading…</div></div>';

  const ds=DEMCLS.map(c=>({name:c,col:COL[c],data:idx.map(i=>fn(D.cls[c],i))}));
  mkChart(document.getElementById('c'),labels,ds,v=>v==null?'':(dMode==='share'?(+v).toFixed(1)+'%':dMode==='abs'?'J$'+(+v).toFixed(0)+'M':'J$'+(+v).toFixed(2)));
  const totDem=idx.map(i=>D.classes.reduce((s,c)=>s+D.cls[c].demand[i],0)/1e6);
  const last=totDem[totDem.length-1], prev=totDem.length>1?totDem[totDem.length-2]:null;
  const i0=idx[0], i1=idx[idx.length-1];
  const movers=D.accts.map(a=>({n:a.n,c:a.c,d:(a.dem[i1]-a.dem[i0])/1e6})).filter(m=>isFinite(m.d)).sort((x,y)=>x.d-y.d);
  const dilut=D.accts.filter(a=>a.kwh[i1]>a.kwh[i0]&&a.dem[i1]<a.dem[i0]).length;
  let kp=kpi('Total demand · '+labels[labels.length-1],'J$'+last.toFixed(0)+'M',prev!=null?sp(pctV(prev,last))+'% vs prev':'',last>=(prev||last)?'up':'dn')+
    kpi('Dilution accounts',dilut+' of '+D.accts.length,'kWh ↑ but demand ↓','dn');
  kp+='<div class="kpi" style="border-left-color:'+COL.RT70+'"><div class="l">Biggest demand drops · '+labels[0]+'→'+labels[labels.length-1]+'</div><div style="font-size:12px;line-height:1.7;margin-top:4px">'+

let chartKva=null;
async function renderDemandKva(){
  const panel=document.getElementById('kvaPanel');
  if(!panel)return;
  const rows=await _fetchDemandKva();
  if(!rows.length){panel.innerHTML='<span style="color:var(--mut)">No kVA demand data loaded yet.</span>';return;}
  const ymKey=r=>r.year+'-'+String(r.month).padStart(2,'0');
  const months=[...new Set(rows.map(ymKey))].sort().slice(-6);
  const sumFor=(ym,type)=>rows.filter(r=>ymKey(r)===ym&&(!type||r.demand_type===type)).reduce((s,r)=>s+(+r.demand_kva||0),0);
  const fmtKva=v=>Math.round(v).toLocaleString();
  const latest=months[months.length-1],prev=months.length>1?months[months.length-2]:null;
  const latestTotal=sumFor(latest,null),prevTotal=prev?sumFor(prev,null):null;
  const peakShare=latestTotal?sumFor(latest,'on_peak')/latestTotal*100:0;
  let h='<div class="kpis" style="margin-bottom:10px">'+
    kpi('Total kVA · '+latest,fmtKva(latestTotal),prevTotal?sp(pctV(prevTotal,latestTotal))+'% vs prior month':'',latestTotal>=(prevTotal||latestTotal)?'up':'dn')+
    kpi('On-Peak Share',peakShare.toFixed(1)+'%','of total billed kVA','')+
    '</div><div class="chartwrap" style="height:220px"><canvas id="cKva"></canvas></div>';
  panel.innerHTML=h;
  const ctx=document.getElementById('cKva');
  if(!ctx)return;
  if(chartKva)chartKva.destroy();
  const dsets=DEM_TYPE_ORDER.map(t=>({label:DEM_TYPE_LABEL[t],data:months.map(m=>Math.round(sumFor(m,t))),backgroundColor:DEM_TYPE_COLOR[t]}));
  chartKva=new Chart(ctx,{type:'bar',data:{labels:months,datasets:dsets},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,position:'bottom',labels:{boxWidth:10,padding:8}}},
      scales:{x:{stacked:true},y:{stacked:true}}}});
}
// SCAT_CODE -> adjustment type. The 12 codes present in jps_special_account_adjustments
// are 3 magnitude bases (KVA=demand kVA, KW=demand kW, KWH=energy kWh) each with 3
// time-of-use suffixes (P=on-peak, O=off-peak, L=partial-peak) plus the unsuffixed
// standard code. No fuel/IPP/customer-charge SCAT_CODE appears in this table at all —
// this loader only captures demand+energy corrections from the Consumption Detail
// files; fuel and IPP pass-through adjustments (if any) live in a different billing
// process this table was never built to see. Shown explicitly below, not hidden.
const SCAT_TYPE={
  KVA:'Demand (kVA)',KVAP:'Demand (kVA)',KVAO:'Demand (kVA)',KVAL:'Demand (kVA)',
  KW:'Demand (kW)',KWP:'Demand (kW)',KWO:'Demand (kW)',KWL:'Demand (kW)',
  KWH:'Energy (kWh)',KWHP:'Energy (kWh)',KWHO:'Energy (kWh)',KWHL:'Energy (kWh)',
};
const SCAT_TYPE_ORDER=['Demand (kVA)','Demand (kW)','Energy (kWh)'];
const SCAT_TYPE_COLOR={'Demand (kVA)':'#BA7517','Demand (kW)':'#8B5CF6','Energy (kWh)':'#1D9E75'};
function typeFor(scat){return SCAT_TYPE[scat]||('Other ('+(scat||'—')+')');}

let chartAdj=null;
let adjMonthFilter=null; // set by clicking a bar in the monthly chart; null = all months
let adjMetric='dollar'; // 'dollar' | 'energy' | 'demand' | 'volumes' — what the "Net ___" columns show
const ADJ_DEMAND_CODES=new Set(['KVA','KVAP','KVAO','KVAL','KW','KWP','KWO','KWL']);
const ADJ_ENERGY_CODES=new Set(['KWH','KWHP','KWHO','KWHL']);
function adjMetricVal(r){
  if(adjMetric==='volumes')return 1;
  if(adjMetric==='dollar'){const v=adjDollarVal(r);return v==null?0:v;}
  if(adjMetric==='demand')return ADJ_DEMAND_CODES.has(r.scat_code)?(+r.adj_value||0):0;
  return ADJ_ENERGY_CODES.has(r.scat_code)?(+r.adj_value||0):0;
}
function adjMetricLabel(){
  if(adjMetric==='volumes')return '# Adjustments';
  if(adjMetric==='dollar')return 'Net Value (J$)';
  return adjMetric==='demand'?'Net Demand (kVA+kW)':'Net Energy (kWh)';
}

  if(adjMetric==='dollar'){
    const priced=rows.filter(r=>ADJ_DOLLAR_FIELD[r.scat_code]);

      (unpriced?' <b style="color:'+(unpriced>0?'#BA7517':'inherit')+'">'+unpriced+' of '+rows.length+' rows excluded</b> — kW-family codes have no distinct kW tariff line in this system (demand is billed in kVA; converting kW via the kVA rate would silently assume unity power factor, so those rows show as J$0 here rather than a guessed number). Switch to Demand (kVA/kW) to see them in physical units.':'')+
      '</span>';
  }
  const months=[...new Set(rows.map(ymKey))].sort();
  const whos=[...new Set(rows.map(r=>r.who||'Unidentified'))];
  const WHO_COLOR={'Karlease Brown':'#3b6ea5','Taneece Treasure':'#e25c4b','Norman Titus':'#1D9E75'};
  const colorFor=w=>WHO_COLOR[w]||'#BA7517';

let adjAccountFocus=null; // account_name to focus the monthly table on; null = all accounts
function renderAdjMonthlyByAccount(rows, months, ymKey){
  const wrap=document.getElementById('adjMonthlyByAccount');
  if(!wrap)return;
  const accts=[...new Set(rows.map(r=>r.account_name||'(unnamed account)'))].sort();

  let html='<div class="chartttl">Monthly detail by customer'+(adjAccountFocus?' — '+esc(adjAccountFocus)+' <a href="javascript:void(0)" id="adjAcctReset" style="font-weight:400;color:var(--mut);text-decoration:underline;font-size:11px;margin-left:8px">show all accounts</a>':' <span style="font-weight:400;color:var(--mut);font-size:11px">('+esc(adjMetricLabel())+' per month; click a customer above to focus)</span>')+'</div>';
  html+='<div style="overflow-x:auto"><table style="width:100%;font-size:11.5px;border-collapse:collapse;min-width:'+(700+months.length*70)+'px">'+
    '<thead><tr style="color:var(--mut);text-align:left"><th style="padding:4px;position:sticky;left:0;background:var(--card)">Account</th>'+
    months.map(m=>'<th style="padding:4px;text-align:right'+(m===adjMonthFilter?';background:#3a2c0f;color:#e8b866':'')+'">'+esc(m)+'</th>').join('')+
    '<th style="padding:4px;text-align:right;font-weight:700">Total</th></tr></thead><tbody>';
  const colTotals={}; let grandTotal=0, grandN=0;
  const acctHtmlRows=shown.map(acct=>{
    const acctRows=rows.filter(r=>(r.account_name||'(unnamed account)')===acct);
    if(!acctRows.length)return '';
    const byMonth={};
    let total=0;
    acctRows.forEach(r=>{
      const ym=ymKey(r);
      if(!byMonth[ym])byMonth[ym]={n:0,val:0};
      byMonth[ym].n++;
      const v=adjMetricVal(r);
      byMonth[ym].val+=v; total+=v;
      const ct=colTotals[ym]=colTotals[ym]||{n:0,val:0};
      ct.n++; ct.val+=v;
    });
    grandTotal+=total; grandN+=acctRows.length;
    return '<tr style="border-top:1px solid #1e2d40"><td style="padding:4px;font-weight:500;position:sticky;left:0;background:var(--card)">'+esc(acct)+'</td>'+
      months.map(m=>{
        const v=byMonth[m];
        const hl=m===adjMonthFilter?'background:#2a2010;':'';
        if(!v)return '<td style="padding:4px;text-align:right;color:#3a4557;'+hl+'">·</td>';
        const txt=adjMetric==='volumes'?String(v.n):(v.val?Math.round(v.val).toLocaleString():'0');
        return '<td style="padding:4px;text-align:right;'+hl+'" title="'+v.n+' adjustment(s)">'+txt+'</td>';
      }).join('')+
      '<td style="padding:4px;text-align:right;font-weight:700">'+Math.round(total).toLocaleString()+'</td></tr>';
  });
  html+='<tr style="border-top:2px solid var(--line);font-weight:700;background:#F8FAFC"><td style="padding:4px;position:sticky;left:0;background:#F8FAFC">TOTAL</td>'+
    months.map(m=>{
      const ct=colTotals[m];
      const hl=m===adjMonthFilter?'background:#3a2c0f;color:#e8b866;':'';
      if(!ct)return '<td style="padding:4px;text-align:right;'+hl+'">·</td>';
      const txt=adjMetric==='volumes'?String(ct.n):Math.round(ct.val).toLocaleString();
      return '<td style="padding:4px;text-align:right;'+hl+'">'+txt+'</td>';
    }).join('')+
    '<td style="padding:4px;text-align:right">'+(adjMetric==='volumes'?grandN:Math.round(grandTotal).toLocaleString())+'</td></tr>';
  html+=acctHtmlRows.join('');
  html+='</tbody></table></div>';
  wrap.innerHTML=html;
  const resetBtn=document.getElementById('adjAcctReset');
  if(resetBtn)resetBtn.onclick=()=>{adjAccountFocus=null;renderAdjMonthlyByAccount(rows,months,ymKey);};
}

/* ==========================================
   CUSTOMER CHARGE ANOMALY VIEW — customer charge is a flat monthly fee set per
   rate class (jps_tariff_rates.customer_charge_jmd), billed the same every month
   to every account on that class. It is NOT itemized as a correctable SCAT_CODE
   anywhere in the raw billing extracts (verified: the full SCAT_CODE universe in
   the Consumption Detail files is only KVA/KW/KWH families — no customer-charge,
   fuel, or IPP code exists at the meter-reading level), so it can't be analyzed
   via jps_special_account_adjustments. It IS already present per account per
   month in this page's own embedded data (D.accts[i].cust, in J$) — built for the
   revenue-mix breakdown elsewhere in this app — so this view reuses that directly,
   no new data pull. Because the charge should be flat, ANY month-to-month move is
   inherently suspicious (unlike kWh/demand, which are supposed to vary).
========================================== */
let ccThreshold=0.05; // flag if a month deviates from the account's own median by more than this
let ccSearch='';
function _ccAnomalies(){
  const out=[];
  const idx=selIdx(); // both the account's "normal" (median) and the flagged months are scoped to the global filter
  D.accts.forEach(a=>{
    const c=a.cust||[];
    const vals=idx.map(i=>c[i]).filter(v=>v!=null);
    if(vals.length<2)return;
    const sorted=[...vals].sort((x,y)=>x-y);
    const med=sorted.length%2?sorted[(sorted.length-1)/2]:(sorted[sorted.length/2-1]+sorted[sorted.length/2])/2;
    if(!med)return; // median 0 — can't compute a meaningful % deviation
    idx.forEach(i=>{
      const v=c[i];
      if(v==null)return;
      const dev=(v-med)/med;
      if(Math.abs(dev)>ccThreshold){
        out.push({name:a.n,rc:a.c,parish:a.pg,month:D.months[i],mlabel:D.mlabels[i],normal:med,actual:v,dev:dev*100});
      }
    });
  });
  return out.sort((x,y)=>Math.abs(y.dev)-Math.abs(x.dev));
}
async function renderCustCharge(){
  await _fetchTariffs(); // needed for the persistent (tariff-expected) section
  const anomalies=_ccAnomalies();
  const flaggedAccts=new Set(anomalies.map(x=>x.name));
  // Net J$ impact: sum of (actual − account's own normal) across flagged months —
  // the number that turns "251 flags" into a revenue-variance headline.
  const ccImpact=anomalies.reduce((s,x)=>s+(x.actual-x.normal),0);
  let h='<div class="grid" style="grid-template-columns:repeat(4,1fr)"><div class="card"><div class="chartttl">Accounts analyzed</div><div style="font-size:26px;font-weight:700;margin-top:4px">'+D.accts.filter(a=>(a.cust||[]).filter(v=>v!=null).length>=2).length+'</div></div>'+
    '<div class="card"><div class="chartttl">Accounts with an anomaly</div><div style="font-size:26px;font-weight:700;margin-top:4px;color:#e25c4b">'+flaggedAccts.size+'</div></div>'+
    '<div class="card"><div class="chartttl">Anomalous account-months</div><div style="font-size:26px;font-weight:700;margin-top:4px;color:#e25c4b">'+anomalies.length+'</div></div>'+
    '<div class="card"><div class="chartttl">Net J$ variance (flagged)</div><div style="font-size:26px;font-weight:700;margin-top:4px;color:'+(ccImpact<0?'#e25c4b':'#1D9E75')+'">'+_digestMoney(ccImpact)+'</div></div></div>';

  h+='<div class="card" style="margin-top:14px;padding:10px 14px;display:flex;gap:16px;align-items:center;flex-wrap:wrap">'+
    '<div><span style="font-size:11px;color:var(--mut);margin-right:8px">Flag threshold:</span><div class="seg" id="ccThreshSeg">'+
    [[0.02,'>2%'],[0.05,'>5%'],[0.10,'>10%']].map(o=>'<button data-th="'+o[0]+'" class="'+(ccThreshold===o[0]?'on':'')+'">'+o[1]+' vs own median</button>').join('')+'</div></div>'+
    '<div style="flex:1;min-width:220px"><input id="ccSearchBox" type="text" placeholder="Search any customer (regardless of flag)…" value="'+esc(ccSearch)+'" style="width:100%;padding:6px 10px;border-radius:6px;border:1px solid #2a3a4d;background:#0e1826;color:var(--fg);font-size:12px"></div></div>';

  h+='<div class="card" style="margin-top:14px" id="ccSearchResult"></div>';
  h+='<div class="card" style="margin-top:14px" id="ccPersistent"></div>';
  h+='<div class="card" style="margin-top:14px" id="ccAnomalyTable"></div>';
  document.getElementById('app').innerHTML=h;

  // ── Persistent billing anomalies: tariff cross-check. The own-median detector
  // above is blind to an account that has been billed WRONG EVERY MONTH — its own
  // history looks stable. Cross-check: an account's median charge should be an
  // integer multiple of its rate class tariff (charge × #services). A fractional
  // MEDIAN multiple across the whole window is structural, not proration (a
  // mid-cycle start prorates ONE month, not the median). Aggregate/bulk rows
  // (implied > 200 meters) are skipped — integer drift there is rounding noise.
  const persistent=[];
  const ccIdx=selIdx();
  const tariffYear=+D.months[ccIdx[ccIdx.length-1]].slice(0,4);
  D.accts.forEach(a=>{
    const vals=ccIdx.map(i=>a.cust&&a.cust[i]).filter(v=>v!=null&&v>0);
    if(vals.length<4)return;
    const t=_ccTariffFor(a.c,tariffYear);
    if(!t)return;
    const sorted=[...vals].sort((x,y)=>x-y);
    const med=sorted.length%2?sorted[(sorted.length-1)/2]:(sorted[sorted.length/2-1]+sorted[sorted.length/2])/2;
    const implied=med/t;
    if(implied>200)return;
    const nearest=Math.round(implied);
    if(nearest>=1&&Math.abs(implied-nearest)<=0.02)return;
    persistent.push({n:a.n,rc:a.c,med,t,implied,gap:Math.abs(implied-Math.max(nearest,1))*t});
  });
  persistent.sort((x,y)=>y.gap-x.gap);
  let pHtml='<div class="chartttl">Persistent billing anomalies &mdash; tariff cross-check <span style="font-weight:400;color:var(--mut);font-size:11px">(accounts whose NORMAL charge is not a clean multiple of their rate-class tariff &mdash; the own-history detector above cannot see these)</span></div>';
  if(!Object.keys(_tariffs||{}).length){
    // Never report "clean" when the reference data simply failed to load.
    pHtml+='<div style="color:#e25c4b;font-size:12px;padding:6px 0">Tariff reference data unavailable (jps_tariff_rates fetch returned nothing) &mdash; cross-check NOT performed. Sign in and reload, or check the table&rsquo;s RLS.</div>';
  }else if(!persistent.length){
    pHtml+='<div style="color:var(--mut);font-size:12px;padding:6px 0">Every analyzed account&rsquo;s median charge is a clean integer multiple of its tariff &mdash; no structural billing errors detected.</div>';
  }else{
    pHtml+='<table style="width:100%;font-size:12px;border-collapse:collapse"><thead><tr style="color:var(--mut);text-align:left">'+
      '<th style="padding:4px">Customer</th><th style="padding:4px">Rate Class</th><th style="padding:4px;text-align:right">Median charge (J$)</th><th style="padding:4px;text-align:right">Tariff (J$)</th><th style="padding:4px;text-align:right">Implied services</th><th style="padding:4px;text-align:right">Structural gap (J$/mo)</th></tr></thead><tbody>';
    pHtml+='<tr style="font-weight:700;background:#F8FAFC"><td style="padding:4px" colspan="2">TOTAL &middot; '+persistent.length+' accounts</td><td style="padding:4px;text-align:right">&mdash;</td><td style="padding:4px;text-align:right">&mdash;</td><td style="padding:4px;text-align:right">&mdash;</td><td style="padding:4px;text-align:right">'+Math.round(persistent.reduce((s,x)=>s+x.gap,0)).toLocaleString()+'</td></tr>';
    persistent.slice(0,50).forEach(x=>{
      pHtml+='<tr class="ccAnomRow" data-nm="'+esc(x.n)+'" style="border-top:1px solid var(--line);cursor:pointer" onmouseover="this.style.background=\'#F0F4F8\'" onmouseout="this.style.background=\'\'">'+
        '<td style="padding:4px;font-weight:500">'+esc(x.n)+'</td><td style="padding:4px">'+esc(x.rc)+'</td>'+
        '<td style="padding:4px;text-align:right">'+Math.round(x.med).toLocaleString()+'</td>'+
        '<td style="padding:4px;text-align:right">'+Math.round(x.t).toLocaleString()+'</td>'+
        '<td style="padding:4px;text-align:right;font-weight:600;color:#BA7517">'+x.implied.toFixed(2)+'&times;</td>'+
        '<td style="padding:4px;text-align:right">'+Math.round(x.gap).toLocaleString()+'</td></tr>';
    });
    pHtml+='</tbody></table>';
    if(persistent.length>50)pHtml+='<div style="font-size:10.5px;color:var(--mut);padding:6px 4px 0">Showing worst 50 of '+persistent.length+' by structural J$ gap.</div>';
  }
  pHtml+='<div style="font-size:10.5px;color:var(--mut);padding:8px 4px 0">Tariffs read live from jps_tariff_rates ('+tariffYear+'). A fractional multiple in a single month is usually proration; a fractional MEDIAN is a standing billing setup issue worth a ticket.</div>';
  document.getElementById('ccPersistent').innerHTML=pHtml;

  document.querySelectorAll('#ccThreshSeg [data-th]').forEach(b=>b.onclick=()=>{ccThreshold=+b.dataset.th;renderCustCharge();});
  const searchBox=document.getElementById('ccSearchBox');
  searchBox.oninput=e=>{ccSearch=e.target.value;_ccRenderSearch();};
  searchBox.focus(); searchBox.setSelectionRange(ccSearch.length,ccSearch.length);
  _ccRenderSearch();

  const cap=100;
  let tblHtml='<div class="chartttl">Anomalies — customers not following their own normal trend'+(anomalies.length>cap?' <span style="font-weight:400;color:var(--mut);font-size:11px">(showing worst '+cap+' of '+anomalies.length+')</span>':'')+'</div>';
  if(!anomalies.length){
    tblHtml+='<div style="color:var(--mut);font-size:12px;padding:6px 0">No account exceeds the '+(ccThreshold*100)+'% threshold — customer charge billing looks clean at this sensitivity.</div>';
  }else{
    tblHtml+='<table style="width:100%;font-size:12px;border-collapse:collapse"><thead><tr style="color:var(--mut);text-align:left">'+
      '<th style="padding:4px">Customer</th><th style="padding:4px">Rate Class</th><th style="padding:4px">Month</th><th style="padding:4px;text-align:right">Normal (J$)</th><th style="padding:4px;text-align:right">Actual (J$)</th><th style="padding:4px;text-align:right">Deviation</th></tr></thead><tbody>';
    const shownAnom=anomalies.slice(0,cap);
    const tNorm=shownAnom.reduce((s,x)=>s+x.normal,0), tAct=shownAnom.reduce((s,x)=>s+x.actual,0);
    tblHtml+='<tr style="font-weight:700;background:#F8FAFC"><td style="padding:4px" colspan="3">TOTAL (shown '+shownAnom.length+')</td>'+
      '<td style="padding:4px;text-align:right">'+Math.round(tNorm).toLocaleString()+'</td>'+
      '<td style="padding:4px;text-align:right">'+Math.round(tAct).toLocaleString()+'</td>'+
      '<td style="padding:4px;text-align:right;color:'+(tAct<tNorm?'#e25c4b':'#1D9E75')+'">'+_digestMoney(tAct-tNorm)+'</td></tr>';
    shownAnom.forEach(x=>{
      tblHtml+='<tr class="ccAnomRow" data-nm="'+esc(x.name)+'" style="border-top:1px solid #1e2d40;cursor:pointer" onmouseover="this.style.background=\'#16222f\'" onmouseout="this.style.background=\'\'">'+
        '<td style="padding:4px;font-weight:500">'+esc(x.name)+'</td>'+
        '<td style="padding:4px">'+esc(x.rc)+'</td>'+
        '<td style="padding:4px">'+esc(x.mlabel)+'</td>'+
        '<td style="padding:4px;text-align:right">'+Math.round(x.normal).toLocaleString()+'</td>'+
        '<td style="padding:4px;text-align:right;font-weight:600;color:'+(x.actual<0?'#e25c4b':'inherit')+'">'+Math.round(x.actual).toLocaleString()+'</td>'+
        '<td style="padding:4px;text-align:right;color:'+(x.dev<0?'#e25c4b':'#BA7517')+'">'+(x.dev>=0?'+':'')+x.dev.toFixed(1)+'%</td></tr>';
    });
    tblHtml+='</tbody></table>';
  }
  document.getElementById('ccAnomalyTable').innerHTML=tblHtml;
  document.querySelectorAll('.ccAnomRow').forEach(tr=>{
    tr.onclick=()=>{ccSearch=tr.dataset.nm;searchBox.value=ccSearch;_ccRenderSearch();document.getElementById('ccSearchResult').scrollIntoView({behavior:'smooth',block:'center'});};
  });
}
function _ccRenderSearch(){
  const wrap=document.getElementById('ccSearchResult');
  if(!wrap)return;
  if(!ccSearch||ccSearch.length<2){wrap.innerHTML='<span style="color:var(--mut);font-size:12px">Type at least 2 characters to look up a customer&#39;s full monthly customer-charge history.</span>';return;}
  const q=ccSearch.toLowerCase();
  const matches=D.accts.filter(a=>(a.n||'').toLowerCase().includes(q)).slice(0,15);
  if(!matches.length){wrap.innerHTML='<span style="color:var(--mut);font-size:12px">No customer matches "'+esc(ccSearch)+'".</span>';return;}
  const sIdx=selIdx();
  let html='<div class="chartttl">'+matches.length+' match'+(matches.length===1?'':'es')+'</div><table style="width:100%;font-size:11.5px;border-collapse:collapse"><thead><tr style="color:var(--mut);text-align:left"><th style="padding:4px">Customer</th><th style="padding:4px">Rate Class</th>'+
    sIdx.map(i=>'<th style="padding:4px;text-align:right">'+esc(D.mlabels[i])+'</th>').join('')+'<th style="padding:4px;text-align:right;font-weight:700">Total</th></tr></thead><tbody>';
  let colTotals=sIdx.map(()=>0);
  matches.forEach(a=>{
    const c=a.cust||[];
    const vals=sIdx.map(i=>c[i]).filter(v=>v!=null);
    const sorted=[...vals].sort((x,y)=>x-y);
    const med=sorted.length?(sorted.length%2?sorted[(sorted.length-1)/2]:(sorted[sorted.length/2-1]+sorted[sorted.length/2])/2):0;
    let rowTotal=0;
    html+='<tr style="border-top:1px solid #1e2d40"><td style="padding:4px;font-weight:500">'+esc(a.n)+'</td><td style="padding:4px">'+esc(a.c)+'</td>'+
      sIdx.map((i,k)=>{
        const v=c[i];
        if(v==null)return '<td style="padding:4px;text-align:right;color:#3a4557">·</td>';
        rowTotal+=v; colTotals[k]+=v;
        const flagged=med&&Math.abs((v-med)/med)>ccThreshold;
        return '<td style="padding:4px;text-align:right'+(flagged?';color:#e25c4b;font-weight:700':'')+'" title="normal ~'+Math.round(med).toLocaleString()+'">'+Math.round(v).toLocaleString()+'</td>';
      }).join('')+'<td style="padding:4px;text-align:right;font-weight:700">'+Math.round(rowTotal).toLocaleString()+'</td></tr>';
  });
  html+='<tr style="border-top:2px solid var(--line);font-weight:700;background:#F8FAFC"><td style="padding:4px" colspan="2">TOTAL</td>'+
    colTotals.map(v=>'<td style="padding:4px;text-align:right">'+Math.round(v).toLocaleString()+'</td>').join('')+
    '<td style="padding:4px;text-align:right">'+Math.round(colTotals.reduce((s,v)=>s+v,0)).toLocaleString()+'</td></tr>';
  html+='</tbody></table>';
  wrap.innerHTML=html;
}

let _tariffs=null;
async function _fetchTariffs(){

// Explorer buckets RT60-ST rows under 'RT60'; the tariff table keys them 'RT60-ST'.
function _tariffRowFor(rc,year){
  const key=(rc==='RT60'?'RT60-ST':rc)+'_'+year;
  return _tariffs?_tariffs[key]:undefined;
}
function _ccTariffFor(rc,year){

// SCAT_CODE -> the tariff column that prices it, for converting a physical
// adjustment quantity to J$. KW-family codes have no distinct kW tariff line in
// jps_tariff_rates (demand is billed in kVA) — converting them via the kVA rate
// would silently assume unity power factor, so they're excluded from $ rather
// than guessed. KWH suffixes (P/O/L) share the one energy_rate_jmd_kwh column —
// this tariff has no time-of-use energy pricing, only time-of-use demand.
const ADJ_DOLLAR_FIELD={
  KWH:'energy_rate_jmd_kwh',KWHP:'energy_rate_jmd_kwh',KWHO:'energy_rate_jmd_kwh',KWHL:'energy_rate_jmd_kwh',
  KVA:'demand_rate_standard_jmd',KVAP:'demand_rate_on_peak_jmd',KVAO:'demand_rate_off_peak_jmd',KVAL:'demand_rate_partial_peak_jmd',
};
function adjDollarVal(r){
  const field=ADJ_DOLLAR_FIELD[r.scat_code];
  if(!field)return null; // KW-family, or an unrecognized code — not prices
  const row=_tariffRowFor(r.rate_class,r.year);
  if(!row||row[field]==null)return null;
  return (+r.adj_value||0)*(+row[field]);
}

/* ==========================================
   LIVE DATA BOOTSTRAP — builds D from jps_billing_components (account-level
   revenue components: kwh/fuel/ipp/energy/demand/customer-charge) + jps_kam +
   jps_industries, on every page load. Replaces the old build-time embedded blob.
   Aggregation (class/parish/total rollups) mirrors gen_appdata3.py exactly,
   ported to JS, so every existing render function needs zero changes.
========================================== */
async function _fetchBillingComponents(){
  const cols='month,account_code,name,rate_class,parish_group,kwh,revenue_jmd,demand_jmd,fuel_jmd,energy_jmd,ipp_jmd,customer_charge_jmd';
  const PAGE=1000;
  // Was a sequential for(;;) loop — one page had to round-trip before the next
  // was even requested, so ~10k rows meant ~11 serial fetches. Get the exact
  // row count first (cheap HEAD request), then fire every page concurrently.
  const{count,error:countErr}=await _SB.from('jps_billing_components').select('*',{count:'exact',head:true});
  if(countErr){console.error('jps_billing_components count failed',countErr);return[];}
  if(!count)return[];
  const pages=Math.ceil(count/PAGE);
  const results=await Promise.all(Array.from({length:pages},(_,p)=>
    _SB.from('jps_billing_components').select(cols).range(p*PAGE,p*PAGE+PAGE-1)));
  const all=[];
  results.forEach(({data,error})=>{
    if(error){console.error('jps_billing_components page fetch failed',error);return;}
    if(data)all.push(...data);
  });
  return all;
}
async function _fetchKamIndustryMaps(){
  const[{data:kamData,error:kErr},{data:indData,error:iErr}]=await Promise.all([

  ]);

  const indMap={};(iErr?[]:indData||[]).forEach(r=>{if(r.industry)indMap[String(r.jps_ac||'').trim()]=r.industry;});

}
// Same exact-then-prefix fallback as the Driver Forecast engine's _kl() in
// JPS_Sales_Platform_v1.html — jps_kam/jps_industries key on the customer-number
// prefix, not the full "customer-premises" account code.
function _klLive(map,ac){
  ac=String(ac||'');
  if(map[ac]!=null)return map[ac];
  return map[ac.split('-')[0]]||'';
}
const MLAB_MON={'01':'Jan','02':'Feb','03':'Mar','04':'Apr','05':'May','06':'Jun','07':'Jul','08':'Aug','09':'Sep','10':'Oct','11':'Nov','12':'Dec'};
const BILLING_CLASSES=['RT10','RT20','RT40','RT50','RT60','RT70','Other'];
const BILLING_KEYS=['kwh','rev','demand','fuel','energy','ipp','cust_chg'];

// Aggregate-only view (rate_class x year x month sums — no per-customer rows),
// backing both the Trends "Actual vs Budget" overlay and Top Variance Movers.
// Deliberately NOT the raw jps_budget table: that table is 111K+ per-account
// rows and anon access to it is being phased out (see jps-actuals-budget-anon-
// lockdown-jul11 memory) — this view is the replacement so Explorer never needs
// direct anon access to raw jps_budget again.
async function _fetchBudgetClassMonth(){
  const{data,error}=await _SB.from('jps_budget_class_month').select('rate_class,year,month,kwh_budget,revenue_budget,demand_budget');
  return error?[]:(data||[]);
}
function _budByClsMonth(budRows){
  const budByClsMonth={}; // 'RC_M' -> {kwh,rev,dem}
  budRows.forEach(r=>{
    const rc=(r.rate_class==='RT60-ST'?'RT60':r.rate_class);
    const key=rc+'_'+r.month;
    const b=budByClsMonth[key]=budByClsMonth[key]||{kwh:0,rev:0,dem:0};
    b.kwh+=+r.kwh_budget||0; b.rev+=(+r.revenue_budget||0)+(+r.demand_budget||0); b.dem+=+r.demand_budget||0;
  });
  return budByClsMonth;
}
// Top Variance Movers (customer view only — see note in renderTopMovers about
// the RT10 consumption-bucket view, which needs a bucket-level live table this
// build doesn't add). Faithfully ports build_top_movers.py's methodology:
// estimated budget = each customer's Jan+Feb actual share of its class, applied
// to the class's YTD budget total (which carries the real monthly/seasonal
// shape) — variance = actual − estimated budget.
async function _computeLiveMovers(accts,months,mIdx,budByClsMonth){
  const ytdYear=months.length?+months[months.length-1].slice(0,4):null;
  const YTD=months.filter(m=>m.startsWith(ytdYear+''));
  const JF=[ytdYear+'-01',ytdYear+'-02'].filter(m=>mIdx[m]!=null);
  if(!YTD.length||!JF.length)return{window:'n/a',note:'Not enough of the current year loaded yet to estimate a seasonal budget split.',byCustomer:{},byBucketRT10:{}};
  const bclassYTD=(metric,cls)=>YTD.reduce((s,m)=>{
    const b=budByClsMonth[cls+'_'+(+m.slice(5,7))];if(!b)return s;
    return s+(metric==='vol'?b.kwh/1000:metric==='dem'?b.dem:b.rev);
  },0);
  const av=(a,i)=>a.kwh[i]/1000, ad=(a,i)=>a.dem[i], ar=(a,i)=>a.fuel[i]+a.energy[i]+a.dem[i]+a.cust[i];
  const MET={vol:av,dem:ad,rev:ar};
  const ytdLbl=YTD.length>1?MLAB_MON[YTD[0].slice(5,7)]+'-'+MLAB_MON[YTD[YTD.length-1].slice(5,7)]+' '+ytdYear:MLAB_MON[YTD[0].slice(5,7)]+' '+ytdYear;
  const out={window:ytdLbl,note:'Estimated budget = Jan+Feb actual share × budgeted class total (seasonally shaped). Variance = Actual − Est. Budget. Budget read live from jps_budget_class_month.',byCustomer:{},byBucketRT10:{}};
  const CLS=['RT40','RT50','RT70'];
  Object.entries(MET).forEach(([metric,fn])=>{
    const rows=[];
    CLS.forEach(cls=>{
      const clsAccts=accts.filter(a=>a.c===cls);
      const clsJF=clsAccts.reduce((s,a)=>s+JF.reduce((s2,m)=>s2+fn(a,mIdx[m]),0),0)||1;
      const budYTD=bclassYTD(metric,cls);
      clsAccts.forEach(a=>{
        const jf=JF.reduce((s,m)=>s+fn(a,mIdx[m]),0);
        const share=jf/clsJF, est=share*budYTD;
        const act=YTD.reduce((s,m)=>s+fn(a,mIdx[m]),0);
        if(Math.abs(act)<1e-6&&Math.abs(est)<1e-6)return;
        rows.push({name:a.n,cls,act:+act.toFixed(2),bud:+est.toFixed(2),var:+(act-est).toFixed(2)});
      });
    });
    rows.sort((a,b)=>Math.abs(b.var)-Math.abs(a.var));
    out.byCustomer[metric]=rows.slice(0,40);
  });
  // RT10 consumption-bucket movers need bucket-grain data this table doesn't
  // carry (jps_billing_components is account-level only) — left empty rather
  // than fabricated; renderTopMovers shows an explicit note instead of a chart.
  return out;
}

// RT10/RT20 (mass-market) are billed at consumption-bucket grain, not account
// grain — corrected_scan.py never puts them in jps_billing_components, so
// D.cls.RT10/RT20 are always zero here (this is pre-existing, not new). jps_budget
// DOES have RT10/RT20 rows (everyone has a budget), so summing budget across ALL
// classes for "Total" would compare real actuals against a budget that includes
// ~J$6-7B/mo of residential budget Explorer has no matching actuals for — a scope
// mismatch, not a real variance. Total budget is scoped to the same classes
// Explorer's actuals cover so the comparison is apples-to-apples.
const BUDGET_COVERED_CLASSES=['RT40','RT50','RT60','RT70','Other'];
// Aligns budget totals (rate_class x year x month, from jps_budget_class_month)
// onto the same D.months index the actuals use, so Trends can overlay Actual vs
// Budget as two series on the same chart. "rev" adds demand_budget back into
// revenue_budget to match how revenue_jmd is the all-inclusive total in actuals
// (see comps() — Demand is a component OF rev, not separate from it), same
// convention _computeLiveMovers already used for its own budget rev.
function _buildBudgetSeries(budRows,months,mIdx){
  // Keyed kwh/rev/demand (not "dem") so MET[k].f() from the Trends metric table
  // works unchanged on D.budget.total/D.budget.cls[c], same as it does on D.total/D.cls.
  const clsBudget={};BILLING_CLASSES.forEach(c=>{clsBudget[c]={kwh:new Array(months.length).fill(null),rev:new Array(months.length).fill(null),demand:new Array(months.length).fill(null)};});
  budRows.forEach(r=>{
    const rc=(r.rate_class==='RT60-ST'?'RT60':r.rate_class);
    const cls=BILLING_CLASSES.includes(rc)?rc:'Other';
    const ym=r.year+'-'+String(r.month).padStart(2,'0');
    const j=mIdx[ym]; if(j==null)return;
    const b=clsBudget[cls];
    b.kwh[j]=(b.kwh[j]||0)+(+r.kwh_budget||0);
    b.rev[j]=(b.rev[j]||0)+(+r.revenue_budget||0)+(+r.demand_budget||0);
    b.demand[j]=(b.demand[j]||0)+(+r.demand_budget||0);
  });
  const total={kwh:new Array(months.length).fill(null),rev:new Array(months.length).fill(null),demand:new Array(months.length).fill(null)};
  months.forEach((_,j)=>{
    ['kwh','rev','demand'].forEach(k=>{
      const vals=BUDGET_COVERED_CLASSES.map(c=>clsBudget[c][k][j]).filter(v=>v!=null);
      total[k][j]=vals.length?vals.reduce((s,v)=>s+v,0):null;
    });
  });
  return {cls:clsBudget,total};
}
async function bootstrapExplorerData(){

         kam:_klLive(kamMap,r.account_code)||'',industry:_klLive(indMap,r.account_code)||''};

    }
    a.kwh[j]+=kwh;a.rev[j]+=rev;a.dem[j]+=dem;a.fuel[j]+=fuel;a.energy[j]+=energy;a.ipp[j]+=ipp;a.cust[j]+=cust;
  });

  D.parishes=parishes;D.parish=parishAgg;

/* ==========================================
   GENERIC ANOMALY ENGINE — one scan across every revenue component.
   Per account, per metric: robust z-score vs the account's own history
   (median ± MAD, z=0.6745·(x−med)/MAD, flag |z|>3.5 — standard robust cut).
   MAD=0 (flat series, e.g. customer charge) → any move >2% of the median
   flags at pseudo-z 99, since a flat series deviating AT ALL is the signal.
   Materiality floors (per metric, shown in the UI) keep pocket-change out.
   CAVEAT: kWh/fuel are seasonal and the embedded window has a Jun–Sep 2025
   gap, so volume flags are leads to investigate, not verdicts.
========================================== */
const ANOM_METRICS={
  kwh:{l:'Volume (kWh)',floor:20000,fmt:v=>Math.round(v).toLocaleString()},
  rev:{l:'Revenue (J$)',floor:500000,fmt:v=>Math.round(v).toLocaleString()},
  energy:{l:'Energy chg (J$)',floor:250000,fmt:v=>Math.round(v).toLocaleString()},
  fuel:{l:'Fuel (J$)',floor:250000,fmt:v=>Math.round(v).toLocaleString()},
  ipp:{l:'IPP (J$)',floor:250000,fmt:v=>Math.round(v).toLocaleString()},
  dem:{l:'Demand chg (J$)',floor:100000,fmt:v=>Math.round(v).toLocaleString()},
  cust:{l:'Customer chg (J$)',floor:2000,fmt:v=>Math.round(v).toLocaleString()},
  rpk:{l:'J$/kWh blended',floor:5,fmt:v=>v.toFixed(1)},
};
function _anomSeries(a,mk){
  // Months outside the global filter come back null — the existing v==null skip
  // in _anomScan means both the "normal" (median/MAD) and the flagged months are
  // scoped to the filtered window, same as the customer-charge anomaly detector.
  const inSel=i=>sel.has(D.months[i]);
  if(mk==='rpk')return D.months.map((_,i)=>(inSel(i)&&a.kwh[i]>10000&&a.rev[i]!=null)?a.rev[i]/a.kwh[i]:null);
  return D.months.map((_,i)=>(inSel(i)&&a[mk])?a[mk][i]:null);
}
let _anomCache=null;
function _anomScan(){
  if(_anomCache)return _anomCache;
  const out=[];
  D.accts.forEach(a=>{
    for(const mk of Object.keys(ANOM_METRICS)){
      const cfg=ANOM_METRICS[mk];
      const series=_anomSeries(a,mk);
      const vals=series.filter(v=>v!=null&&isFinite(v));
      if(vals.length<4)continue;
      const sorted=[...vals].sort((x,y)=>x-y);
      const med=sorted.length%2?sorted[(sorted.length-1)/2]:(sorted[sorted.length/2-1]+sorted[sorted.length/2])/2;
      const absdev=vals.map(v=>Math.abs(v-med)).sort((x,y)=>x-y);
      const mad=absdev.length%2?absdev[(absdev.length-1)/2]:(absdev[absdev.length/2-1]+absdev[absdev.length/2])/2;
      series.forEach((v,i)=>{
        if(v==null||!isFinite(v))return;
        const diff=v-med;
        if(Math.abs(diff)<cfg.floor)return;
        let z;
        if(mad>0){z=0.6745*diff/mad;}
        else{
          if(med===0||Math.abs(diff/med)<0.02)return;
          z=diff>0?99:-99;
        }
        if(Math.abs(z)<3.5)return;
        out.push({name:a.n,rc:a.c,metric:mk,mlabel:D.mlabels[i],month:D.months[i],actual:v,typical:med,z,sev:Math.min(Math.abs(z),99)});
      });
    }
  });
  out.sort((x,y)=>y.sev-x.sev);
  _anomCache=out;
  return out;
}

/* ── Anomalies tab: severity-ranked findings + annotate workflow ── */
let anomMetricFilter='all', anomHideExplained=true, anomSearch='', anomOpenKey=null;

  const reviews=await _fetchAnomReviews();
  const revMap=Object.fromEntries(reviews.map(r=>[_revKey(r),r]));
  const all=_anomScan();
  const counts={};all.forEach(x=>{counts[x.metric]=(counts[x.metric]||0)+1;});
  let rowsF=anomMetricFilter==='all'?all:all.filter(x=>x.metric===anomMetricFilter);

    '<div class="card"><div class="chartttl">Unreviewed</div><div style="font-size:26px;font-weight:700;margin-top:4px;color:#e25c4b">'+unreviewed+'</div></div>'+
    '<div class="card"><div class="chartttl">Explained / escalated</div><div style="font-size:26px;font-weight:700;margin-top:4px;color:#1D9E75">'+reviews.filter(r=>r.status!=='new').length+'</div></div></div>';

/* ── Landing digest: the data nominates its own headlines ── */
function _navTo(v){view=v;render();}
function _digestMoney(v){const s=v<0?'-':'';const a=Math.abs(v);return s+(a>=1e9?'J$'+(a/1e9).toFixed(2)+'B':'J$'+(a/1e6).toFixed(1)+'M');}
async function renderDigest(){
  const app=document.getElementById('app');
  // "This month" = the latest month within the global filter, not necessarily
  // the latest month loaded — so filtering to an earlier window changes the digest too.
  const dIdx=selIdx();
  const iL=dIdx[dIdx.length-1],iP=dIdx.length>1?dIdx[dIdx.length-2]:-1;
  const mL=D.mlabels[iL],mP=D.mlabels[iP]||'—';
  // class movers MoM (rev + kwh)
  const classMoves=D.classes.map(c=>{
    const o=D.cls[c];if(!o)return null;
    return{c,dRev:(o.rev[iL]||0)-(o.rev[iP]||0),dKwh:(o.kwh[iL]||0)-(o.kwh[iP]||0)};
  }).filter(Boolean).sort((a,b)=>Math.abs(b.dRev)-Math.abs(a.dRev));
  const cm=classMoves[0];
  // customer movers MoM by |Δrev|
  const custMoves=D.accts.map(a=>({n:a.n,d:(a.rev[iL]||0)-(a.rev[iP]||0)})).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d)).slice(0,3);
  // anomalies (sync scan; reviews + adjustments fill async below)
  const anoms=_anomScan();
  const anomsLastMonth=anoms.filter(x=>x.month===D.months[iL]);
  // customer-charge summary at current threshold
  const ccA=_ccAnomalies();
  const ccImpact=ccA.reduce((s,x)=>s+(x.actual-x.normal),0);
  // contiguity check for the coverage card
  let gaps=0;
  for(let i=1;i<D.months.length;i++){
    const[y1,m1]=D.months[i-1].split('-').map(Number),[y2,m2]=D.months[i].split('-').map(Number);
    if((y2*12+m2)-(y1*12+m1)!==1)gaps++;
  }
  const card=(title,big,sub,go,goLbl)=>'<div class="card"><div class="chartttl">'+title+'</div>'+
    '<div style="font-size:22px;font-weight:700;margin:6px 0 2px">'+big+'</div>'+
    '<div style="font-size:12px;color:var(--mut);line-height:1.5">'+sub+'</div>'+
    (go?'<div style="margin-top:10px"><button onclick="_navTo(\''+go+'\')" style="border:1px solid var(--line);background:none;border-radius:6px;padding:5px 12px;font-size:11.5px;color:var(--blu);cursor:pointer;font-weight:600">'+goLbl+' &rarr;</button></div>':'')+'</div>';

  let h='<div class="grid" style="grid-template-columns:repeat(3,1fr);gap:14px">';
  h+=card('Data coverage',mL,D.months.length+' months loaded'+(gaps?' &middot; <span style="color:#e25c4b;font-weight:600">'+gaps+' gap'+(gaps>1?'s':'')+' in the series (Jun&ndash;Sep 2025 missing)</span>':' &middot; contiguous'),null,null);
  h+=cm?card('Biggest class move &middot; '+mP+' &rarr; '+mL,esc(cm.c)+' '+(cm.dRev>=0?'+':'')+_digestMoney(cm.dRev),(cm.dKwh>=0?'+':'')+Math.round(cm.dKwh/1e6*10)/10+' GWh volume move in the same month','trends','Trends'):'';
  h+=card('Top customer movers &middot; MoM',esc(custMoves[0].n.slice(0,26)),custMoves.map(x=>esc(x.n.slice(0,26))+' <b>'+(x.d>=0?'+':'')+_digestMoney(x.d)+'</b>').join('<br>'),'customers','Customers');
  h+=card('Anomalies &middot; all components',String(anoms.length),'<span id="digAnomSub">'+anomsLastMonth.length+' in '+mL+' &middot; loading review status&hellip;</span>','anomalies','Review');
  h+=card('Customer charge',ccA.length+' flagged months',_digestMoney(ccImpact)+' net variance vs each account&rsquo;s normal charge &middot; threshold '+(ccThreshold*100)+'%','custcharge','Investigate');
  h+='<div class="card"><div class="chartttl">Adjustments &middot; latest data month</div><div id="digAdj" style="font-size:12px;color:var(--mut);margin-top:6px">Loading&hellip;</div>'+
    '<div style="margin-top:10px"><button onclick="_navTo(\'adjustments\')" style="border:1px solid var(--line);background:none;border-radius:6px;padding:5px 12px;font-size:11.5px;color:var(--blu);cursor:pointer;font-weight:600">Adjustments &rarr;</button></div></div>';
  h+='</div>';
  app.innerHTML=h;

  // async fills — review status + adjustments summary
  _fetchAnomReviews().then(reviews=>{
    const revMap=new Set(reviews.filter(r=>r.status!=='new').map(_revKey));
    const unrev=anoms.filter(x=>!revMap.has(x.name+'|'+x.metric+'|'+x.month)).length;
    const el=document.getElementById('digAnomSub');
    if(el)el.innerHTML=anomsLastMonth.length+' in '+mL+' &middot; <b style="color:#e25c4b">'+unrev+' unreviewed</b> &middot; '+(anoms.length-unrev)+' explained';
  });
  _fetchSpecialAdj().then(rows=>{
    const el=document.getElementById('digAdj');if(!el)return;
    if(!rows.length){el.textContent='No adjustment data loaded.';return;}
    const ymKey=r=>r.year+'-'+String(r.month).padStart(2,'0');
    const monthsInSel=[...new Set(rows.map(ymKey))].filter(m=>sel.has(m)).sort();
    const last=monthsInSel.length?monthsInSel.pop():[...new Set(rows.map(ymKey))].sort().pop();
    const lastRows=rows.filter(r=>ymKey(r)===last);
    const byWho={};lastRows.forEach(r=>{byWho[r.who||'?']=(byWho[r.who||'?']||0)+1;});
    const top=Object.entries(byWho).sort((a,b)=>b[1]-a[1])[0];
    el.innerHTML='<span style="font-size:22px;font-weight:700;color:#1E293B">'+lastRows.length+'</span> line-items in '+last+'<br>'+esc(top[0])+' processed '+top[1]+' ('+Math.round(top[1]/lastRows.length*100)+'%)';
  });
}

  document.getElementById('app').innerHTML=h;
  const pc=(x,y)=>Math.round((x?y/x-1:0)*100);
  const dpkA=a.kwh[iA]?a.dem[iA]/a.kwh[iA]:0, dpkB=a.kwh[iB]?a.dem[iB]/a.kwh[iB]:0;
  const tr=[['kWh',(a.kwh[iA]/1e6).toFixed(1)+'M',(a.kwh[iB]/1e6).toFixed(1)+'M',pc(a.kwh[iA],a.kwh[iB])],['Revenue','J$'+(a.rev[iA]/1e6).toFixed(1)+'M','J$'+(a.rev[iB]/1e6).toFixed(1)+'M',pc(a.rev[iA],a.rev[iB])],['Demand','J$'+(a.dem[iA]/1e6).toFixed(1)+'M','J$'+(a.dem[iB]/1e6).toFixed(1)+'M',pc(a.dem[iA],a.dem[iB])],['Demand/kWh','J$'+dpkA.toFixed(2),'J$'+dpkB.toFixed(2),pc(dpkA,dpkB)]];
  document.getElementById('tb').innerHTML=tr.map(r=>'<tr><td class="l">'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td class="'+(r[3]>=0?'up':'dn')+'">'+(r[3]>=0?'+':'')+r[3]+'%</td></tr>').join('');
  const idx=[pc(a.kwh[iA],a.kwh[iB])+100,pc(a.rev[iA],a.rev[iB])+100,pc(a.dem[iA],a.dem[iB])+100];
  if(chart)chart.destroy();
  chart=new Chart(document.getElementById('c'),{type:'bar',data:{labels:['kWh','Revenue','Demand'],datasets:[{label:D.mlabels[iA],data:[100,100,100],backgroundColor:'#7d93ab',borderRadius:3},{label:D.mlabels[iB],data:idx,backgroundColor:'#3b6ea5',borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'},datalabels:dlbl(v=>Math.round(v))},scales:{x:{grid:{display:false}},y:{grid:{color:'#223247'}}}}});
  document.getElementById('caseSel').onchange=e=>{caseSel=big[+e.target.value].n;renderCases();};
  document.querySelectorAll('[data-anc]').forEach(c=>c.onclick=()=>{const m=D.accts.filter(x=>x.n.toLowerCase().includes(c.dataset.anc.toLowerCase()));if(m.length){caseSel=m.sort((x,y)=>y.rev[iB]-x.rev[iB])[0].n;renderCases();}});
  bindPeriod(renderCases);
}
function renderGiants(){
  const [iA,iB]=aIdx(), cls=['RT40','RT50','RT70'];
  const giants=['alcoa','windalco','caribbean cement'], isG=n=>giants.some(p=>n.toLowerCase().includes(p));
  const cl=c=>wowMet==='rev'?D.cls[c].rev:D.cls[c].demand, ac=a=>wowMet==='rev'?a.rev:a.dem;
  let h='<div class="ctrl">'+periodSel()+'<div class="seg"><button data-wm="rev" class="'+(wowMet==='rev'?'on':'')+'">Revenue</button><button data-wm="dem" class="'+(wowMet==='dem'?'on':'')+'">Demand</button></div></div>';
  h+='<div class="grid"><div class="card"><div class="chartttl">'+D.mlabels[iA]+' → '+D.mlabels[iB]+' · '+(wowMet==='rev'?'revenue':'demand')+' % — all vs ex-giants (Carib/Alcoa/Windalco)</div><div class="chartwrap"><canvas id="c"></canvas></div></div><div class="kpis" id="kp"></div></div>';
  document.getElementById('app').innerHTML=h;
  const R={};
  cls.forEach(c=>{const aA=cl(c)[iA],aB=cl(c)[iB];let gA=0,gB=0;D.accts.forEach(x=>{if(x.c===c&&isG(x.n)){gA+=ac(x)[iA];gB+=ac(x)[iB];}});R[c]={all:pctV(aA,aB),ex:pctV(aA-gA,aB-gB)};});
  if(chart)chart.destroy();
  chart=new Chart(document.getElementById('c'),{type:'bar',data:{labels:cls,datasets:[{label:'All accounts',data:cls.map(c=>+R[c].all.toFixed(1)),backgroundColor:'#3b6ea5',borderRadius:3},{label:'Ex-giants',data:cls.map(c=>+R[c].ex.toFixed(1)),backgroundColor:'#c8772f',borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'},datalabels:dlbl(v=>(v>=0?'+':'')+v.toFixed(1)+'%')},scales:{x:{grid:{display:false}},y:{grid:{color:'#223247'},ticks:{callback:v=>v+'%'}}}}});
  document.getElementById('kp').innerHTML=kpi('RT50 '+(wowMet==='rev'?'revenue':'demand'),(R.RT50.all>=0?'+':'')+R.RT50.all.toFixed(1)+'%','ex-Carib: '+(R.RT50.ex>=0?'+':'')+R.RT50.ex.toFixed(1)+'%',R.RT50.all>=0?'up':'dn')+kpi('RT70 '+(wowMet==='rev'?'revenue':'demand'),(R.RT70.all>=0?'+':'')+R.RT70.all.toFixed(1)+'%','ex-Alcoa/Windalco: '+(R.RT70.ex>=0?'+':'')+R.RT70.ex.toFixed(1)+'%',R.RT70.all>=0?'up':'dn')+'<div class="kpi"><div class="l">Read</div><div style="font-size:12px;line-height:1.5;margin-top:4px;color:#c7d3e0">A few giants mask each class trend. Strip them out to see the underlying book.</div></div>';
  document.querySelectorAll('[data-wm]').forEach(b=>b.onclick=()=>{wowMet=b.dataset.wm;renderGiants();});
  bindPeriod(renderGiants);
}
const MOVMET={kwh:['Volume (kWh)','kwh','M kWh'],rev:['Revenue','rev','M J$'],fuel:['Fuel','fuel','M J$'],ipp:['IPP','ipp','M J$'],energy:['Energy (non-fuel)','energy','M J$'],demand:['Demand','dem','M J$'],cust:['Customer charge','cust','M J$']};
function renderMovers(){
  const [iA,iB]=aIdx();
  const mm=MOVMET[movMet]||MOVMET.kwh, fld=mm[1], un=mm[2];
  const dv=a=>((a[fld]?a[fld][iB]:0)-(a[fld]?a[fld][iA]:0))/1e6;
  let h='<div class="ctrl">'+periodSel()+
    '<span class="lbl">Line</span><select id="mvmet">'+Object.keys(MOVMET).map(k=>'<option value="'+k+'"'+(movMet===k?' selected':'')+'>'+MOVMET[k][0]+'</option>').join('')+'</select>'+
    '<div class="seg"><button data-mvm="topbot" class="'+(movMode==='topbot'?'on':'')+'">Top/bottom 5</button><button data-mvm="cluster" class="'+(movMode==='cluster'?'on':'')+'">Clustered</button></div>';
  if(movMode==='topbot') h+='<div class="seg">'+['RT40','RT50','RT70'].map(c=>'<button data-mvc="'+c+'" class="'+(movCls===c?'on':'')+'">'+c+'</button>').join('')+'</div>';
  h+='</div>';
  if(movMode==='topbot'){
    const m=D.accts.filter(a=>a.c===movCls).map(a=>({n:a.n,d:dv(a)})).sort((x,y)=>y.d-x.d);
    const rows=m.slice(0,5).concat(m.slice(-5));
    h+='<div class="card"><div class="chartttl">'+movCls+' · top &amp; bottom 5 movers · '+mm[0]+' — '+D.mlabels[iA]+' → '+D.mlabels[iB]+' ('+un+')</div><div class="chartwrap" style="height:480px"><canvas id="c"></canvas></div></div>';
    document.getElementById('app').innerHTML=h;
    barChart('c',rows.map(r=>r.n.slice(0,26)),rows.map(r=>+r.d.toFixed(1)),rows.map(r=>r.d>=0?'#1D9E75':'#E24B4A'),v=>(v>=0?'+':'')+v.toFixed(1),{x:{grid:{color:'#223247'}},y:{grid:{display:false},ticks:{font:{size:11}}}},true);
  } else {
    const named=['alcoa','windalco','wigton','jamaica private power','west kingston power','seawind','kingston free port','playa hall','bay roc','x fund','musson international dairies','caribbean cement','jamaica broilers','national water'];
    const isN=n=>named.some(p=>n.toLowerCase().includes(p));
    const co=[],rest=[];
    D.accts.forEach(a=>{const dR=dv(a)*1e6;(isN(a.n)?co:rest).push({n:a.n,dR});});
    const TH=2e6, inc=rest.filter(a=>a.dR>TH), dec=rest.filter(a=>a.dR<-TH), flat=rest.filter(a=>Math.abs(a.dR)<=TH);
    const sum=b=>b.reduce((s,a)=>s+a.dR,0);
    const cl=co.filter(a=>Math.abs(a.dR)>1e6).sort((a,b)=>b.dR-a.dR);
    const labels=cl.map(a=>a.n.slice(0,24)).concat(['▸ Other increase ('+inc.length+')','▸ No change ('+flat.length+')','▸ Other decrease ('+dec.length+')']);
    const data=cl.map(a=>Math.round(a.dR/1e6)).concat([Math.round(sum(inc)/1e6),Math.round(sum(flat)/1e6),Math.round(sum(dec)/1e6)]);
    h+='<div class="card"><div class="chartttl">Clustered movers · '+mm[0]+' — call-outs + buckets · '+D.mlabels[iA]+' → '+D.mlabels[iB]+' ('+un+')</div><div class="chartwrap" style="height:'+(labels.length*30+90)+'px"><canvas id="c"></canvas></div></div>';
    document.getElementById('app').innerHTML=h;
    barChart('c',labels,data,data.map((v,i)=>i>=cl.length?'#BA7517':(v>=0?'#1D9E75':'#E24B4A')),v=>(v>=0?'+':'')+v,{x:{grid:{color:'#223247'}},y:{grid:{display:false},ticks:{font:{size:10.5}}}},true);
  }
  const me=document.getElementById('mvmet'); if(me)me.onchange=e=>{movMet=e.target.value;renderMovers();};
  document.querySelectorAll('[data-mvm]').forEach(b=>b.onclick=()=>{movMode=b.dataset.mvm;renderMovers();});
  document.querySelectorAll('[data-mvc]').forEach(b=>b.onclick=()=>{movCls=b.dataset.mvc;renderMovers();});
  bindPeriod(renderMovers);
}

function render(){
  document.querySelectorAll('.toggle button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  const N=document.getElementById('note');
  // Global month filter — one control for the whole app, always visible regardless
  // of tab. Every view reads the filtered window via selIdx()/visMonths() instead
  // of the raw D.months range.
  const mfb=document.getElementById('monthFilterBar');
  if(mfb){mfb.innerHTML=monthChips();bindMonths(render);}
  if(!sel.size){
    document.getElementById('app').innerHTML='<div class="card" style="color:var(--mut)">No months selected — pick at least one above.</div>';
    N.innerHTML='';
    return;
  }
  if(view==='digest'){renderDigest();N.innerHTML='<b>This month</b> &mdash; auto-generated highlights: what moved, what looks wrong, what needs review. Every card links to the tab with the full detail. The data itself nominates these; nothing here is hand-picked.';}
  else if(view==='anomalies'){renderAnomalies();N.innerHTML='<b>Anomalies</b> &mdash; one engine across every revenue component (kWh, revenue, energy, fuel, IPP, demand, customer charge, blended J$/kWh): each account is compared to its own history with a robust z-score (median &plusmn; MAD), severity-ranked, with a materiality floor so trivia stays out. kWh flags can be seasonal &mdash; treat volume flags as leads, not verdicts. Click a row to annotate; explained items stop counting as new.';}
  else if(view==='answer'){renderAnswer();N.innerHTML='<b>The answer</b> &mdash; pick any two periods. Energy &amp; fuel scale with kWh; the fixed <b>demand</b> charge does not &mdash; so when volume outruns demand, blended realization dilutes. Watch the demand bar lag the volume bar.';}
  else if(view==='bridge'){renderBridge();N.innerHTML='<b>Component bridge</b> between the two selected periods. Splits the revenue change into Fuel/IPP (pass-through) vs the margin-bearing Energy/Demand/Customer charges.';}
  else if(view==='cases'){renderCases();N.innerHTML='<b>Big-customer cases</b> &mdash; meter-level proof for any account, indexed across the two periods. <b>Alcoa</b>: kWh up but demand slashed (extreme dilution). Use the anchor chips or the dropdown.';}
  else if(view==='giants'){renderGiants();N.innerHTML='<b>With vs without the giants</b> &mdash; each class with and without Carib / Alcoa / Windalco, for the selected periods. Strips the few large accounts that mask the underlying class trend.';}
  else if(view==='movers'){renderMovers();N.innerHTML='<b>Movers</b> &mdash; top/bottom 5 by class, or the <b>clustered</b> view: named call-outs pulled out individually, everyone else bucketed into Other increase / decrease / no-change &mdash; all for the selected periods.';}
  else if(view==='topmovers'){renderTopMovers();N.innerHTML='<b>Top Variance Movers</b> &mdash; customers (RT40/50/70) and RT10 consumption buckets ranked by <b>Actual &minus; estimated budget</b> ('+(D.movers?esc(D.movers.window):'YTD')+'). Est. budget = each customer/bucket Jan+Feb share applied to the seasonally-shaped class budget. Toggle Volume / Demand / Revenue.';}
  else if(view==='adjustments'){renderAdjustments();N.innerHTML='<b>Billing adjustments</b> on the 40 Special Accounts (cross-referenced against the Special Accounts Directory) &mdash; monthly count of correction line-items, by who processed them, by rate class, and by adjustment type (demand kVA / demand kW / energy kWh &mdash; no fuel, IPP, or customer-charge adjustments appear in this data, see the Customer Charge tab for that). Switch the metric toggle for $ value, physical units, or plain counts. Nearly all flow through one person (Revenue Management) &mdash; a concentration worth flagging for segregation-of-duties review.';}
  else if(view==='custcharge'){renderCustCharge();N.innerHTML='<b>Customer charge</b> is a flat monthly fee set by rate class (jps_tariff_rates.customer_charge_jmd), billed the same to every account on that class &mdash; it should be essentially constant month to month per account. This view flags accounts whose billed customer charge deviates from their own normal value, which usually means a real billing issue (rate-class change mid-month, missed bill, retroactive credit/reversal) rather than a data artifact. Search any customer to see their full monthly series regardless of whether it is flagged.';}
  else if(view==='trends'){renderTrends();
    document.getElementById('note').innerHTML='<b>Trends</b> across '+D.months.length+' months. Toggle period chips to focus a window; switch metric (revenue, sales, demand charge, realization, non-fuel/fuel tariff, demand share) and group by rate class or total.';}
  else if(view==='mix'){renderMix();
    document.getElementById('note').innerHTML='<b>Revenue breakdown</b> — net revenue split into Fuel & IPP (pass-through), Energy (non-fuel margin), Demand (fixed kVA) and Customer charge, stacked over time. Watch the <b>Demand</b> band shrink as a share — the dilution. Toggle % share, or pick one rate class.';}
  else if(view==='demand'){renderDemand();
    document.getElementById('note').innerHTML='<b>Demand charges</b> by rate class over time — view as J$, % of revenue, or J$/kWh. RT40/50/70 carry demand; watch the band fall as volume rises. Side panel lists the biggest demand drops and the dilution-account count for the selected window.';}
  else if(view==='compare'){renderCompare();
    document.getElementById('note').innerHTML='<b>Compare</b> any two periods side by side — by rate class, revenue components (fuel/IPP/energy/demand/customer), or top-moving customers. Pick Period A and Period B; the table shows the J$ values and Δ%.';}
  else {renderCustomers();
    document.getElementById('note').innerHTML='<b>Customers</b> — '+D.accts.length+' industrial accounts (RT40/50/70). Search/filter, sort by Δ over the selected window, click any row to chart its trend. Switch to <b>By rate class</b> to compare class trajectories.';}
}
document.querySelectorAll('.toggle button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render();});
// Everything below needs live data first — D starts empty (see the D
// declaration up top) and render() would show a blank/broken page if called
// before bootstrapExplorerData() resolves. Show a loading state, fetch, then
// render for real. A slow fetch (cold cache, large jps_billing_components)
// shows a visible spinner rather than a blank screen.
document.getElementById('app').innerHTML='<div class="card" style="text-align:center;padding:40px;color:var(--mut)">Loading live billing data&hellip;</div>';
(async function(){
  try{
    await bootstrapExplorerData();
  }catch(e){
    console.error('bootstrapExplorerData failed',e);
    document.getElementById('app').innerHTML='<div class="card" style="color:#e25c4b">Could not load live data: '+esc(e.message||String(e))+'. Check the console, or that you are signed in.</div>';
    return;
  }
  if(!D.months.length){
    document.getElementById('app').innerHTML='<div class="card" style="color:var(--mut)">No billing data loaded yet in jps_billing_components — run the month-end pipeline, then reload.</div>';
    return;
  }
  document.getElementById('dataStamp').textContent='· Data through '+D.mlabels[D.months.length-1]+' · live';
  // Was a hardcoded "MAY 2026" that never changed as new months loaded — the
  // exact "still says May" confusion this badge itself was causing. Now mirrors
  // the latest loaded month (derived from D.months, e.g. "2026-06" -> "JUN 2026"),
  // same source of truth as dataStamp above.
  var MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  var last=D.months[D.months.length-1].split('-'); // 'YYYY-MM'
  document.getElementById('topbarBadge').textContent=MON[+last[1]-1]+' '+last[0];
  sel=new Set(D.months); // month-chip filter (Trends/Mix/Demand) defaults to "all", same as before
  render();
})();
</script></body></html>
